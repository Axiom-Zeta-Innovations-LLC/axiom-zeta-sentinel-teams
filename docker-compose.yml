version: "3.9"

services:
  axiom-zeta-sentinel-teams:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiom-zeta-sentinel-teams
    env_file:
      - .env
    environment:
      TEAM_STORE_BACKEND: ${TEAM_STORE_BACKEND:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://axiom_zeta_sentinel:axiom_zeta_sentinel@postgres:5432/axiom_zeta_sentinel}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: axiom-zeta-sentinel-teams-postgres
    environment:
      POSTGRES_USER: axiom_zeta_sentinel
      POSTGRES_PASSWORD: axiom_zeta_sentinel
      POSTGRES_DB: axiom_zeta_sentinel
    ports:
      - "5432:5432"
    volumes:
      - axiom_zeta_sentinel_teams_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom_zeta_sentinel -d axiom_zeta_sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  axiom_zeta_sentinel_teams_pg:
